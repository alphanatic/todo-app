# critonite-git-repo-check settings for this project, read by check.sh.

# Folder holding package.json (or the project's code); empty means the repo root
SITE_DIR=""

# Run on every commit by the pre-commit hook; empty skips the project check
CHECK_CMD=""

# Run by check.sh --build and on GitHub
BUILD_CMD="npm run build"

# Private word list in ~/.config/<name>/blocklist, never committed; empty skips the check
BLOCKLIST_NAME=""
