# critonite-git-repo-check: runs check.sh --build on every push, a second net for commits made with --no-verify.
# Skipped here: the private block list (not in the repo).
name: Check

on:
  push:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1, pinned to its commit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # actions/setup-node v7.0.0, pinned to its commit
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26

      # exact versions from the lock file, when the project has one
      - run: |
          . ./check.conf
          dir=${SITE_DIR:-.}
          if [ -f "$dir/package-lock.json" ]; then npm ci --prefix "$dir"; fi

      - run: ./check.sh --build
